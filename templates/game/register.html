{% extends 'base.html' %}{% block title %}Регистрация — Кошмарный карнавал{% endblock %}{% block content %}<div class="row justify-content-center py-5"><div class="col-md-7 col-lg-5"><div class="card p-4 p-md-5"><div class="eyebrow">Новый участник</div><h1 class="h2 mt-2 mb-4">Создать персонажа</h1><form method="post">{% csrf_token %}<label class="form-label">Логин</label><input class="form-control mb-3" name="username" autocomplete="username" required><label class="form-label">Никнейм</label><input class="form-control mb-3" name="nickname" maxlength="32" required><label class="form-label">Пароль</label><input class="form-control mb-2" name="password" type="password" autocomplete="new-password" minlength="12" required><div class="form-text text-muted mb-3">Минимум 12 символов. Не используйте пароль от других сервисов.</div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="consent" value="yes" id="consent" required><label class="form-check-label" for="consent">Вы согласны на проведение всех интерактивов и участия в хеллоине</label></div><button class="btn btn-primary w-100">Зарегистрироваться</button></form></div></div></div>{% endblock %}
